name: Build Unsigned iOS IPA (Deep Debugged)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
      
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS Project
        run: npx expo prebuild --platform ios --no-install

      - name: Bulletproof Node.js Paths for Xcode
        run: |
          # میخ کردن مسیر نود در ریشه سیستم مک تا هیچ اسکریپتی کرش نکند
          sudo ln -sf $(which node) /usr/local/bin/node
          sudo ln -sf $(which npm) /usr/local/bin/npm
          sudo ln -sf $(which npx) /usr/local/bin/npx
          cd ios
          echo "export NODE_BINARY=/usr/local/bin/node" > .xcode.env
          echo "export NODE_BINARY=/usr/local/bin/node" > .xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Surgically Disable Code Signing (Ad-Hoc Fallback)
        run: |
          cd ios
          cat << 'EOF' > nuke_signing.rb
          require 'xcodeproj'
          def disable_signing(project_path)
            return unless File.exist?(project_path)
            project = Xcodeproj::Project.open(project_path)
            project.targets.each do |target|
              target.build_configurations.each do |config|
                # استفاده از امضای موقت Ad-Hoc (-) برای گول زدن کامپایلر JSI
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = '-'
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = '-'
              end
            end
            project.save
          end
          disable_signing(Dir.glob("*.xcodeproj").first)
          disable_signing("Pods/Pods.xcodeproj")
          EOF
          ruby nuke_signing.rb

      - name: Build Unsigned App
        run: |
          cd ios
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme $(ls -d *.xcodeproj | sed 's/\.xcodeproj//') \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            NODE_BINARY=/usr/local/bin/node \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Dump Error Logs on Failure
        if: failure()
        run: |
          echo "=== IF IT FAILS AGAIN, THIS WILL SHOW THE EXACT REASON ==="
          find ios/derivedData -name "*.log" -exec tail -n 100 {} + || true

      - name: Package to IPA
        if: success()
        run: |
          cd ios
          mkdir -p Payload
          cp -r derivedData/Build/Products/Release-iphoneos/*.app Payload/
          zip -q -r my-player.ipa Payload

      - name: Upload Unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: ios/my-player.ipa
