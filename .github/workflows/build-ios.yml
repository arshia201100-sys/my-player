name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Global Node Paths
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node
          sudo ln -sf $(which npm) /usr/local/bin/npm
          sudo ln -sf $(which npx) /usr/local/bin/npx

      - name: Generate Native iOS Project (Clean)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Inject Node into Xcode ENV
        run: |
          cd ios
          echo "export NODE_BINARY=$(which node)" > .xcode.env
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local

      - name: Hijack xcodebuild (The Ultimate Bypass)
        run: |
          mkdir -p $HOME/custom_bin
          cat << 'EOF' > $HOME/custom_bin/xcodebuild
          #!/bin/bash
          /usr/bin/xcodebuild "$@" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE="" PROVISIONING_PROFILE_SPECIFIER="" ENABLE_USER_SCRIPT_SANDBOXING=NO COMPILER_INDEX_STORE_ENABLE=NO
          EOF
          chmod +x $HOME/custom_bin/xcodebuild
          echo "$HOME/custom_bin" >> $GITHUB_PATH

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned App
        run: |
          cd ios
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme $(ls -d *.xcodeproj | sed 's/\.xcodeproj//') \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath derivedData

      - name: Package to IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r derivedData/Build/Products/Release-iphoneos/*.app Payload/
          zip -r RemotePlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemotePlayer-iOS
          path: ios/RemotePlayer.ipa
