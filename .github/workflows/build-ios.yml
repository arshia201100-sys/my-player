name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native iOS Project (Clean)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Configure Node Environment for Expo
        run: |
          cd ios
          echo "export NODE_BINARY=$(which node)" > .xcode.env
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Surgically Disable Code Signing for Main App
        run: |
          cd ios
          cat << 'EOF' > disable_signing.rb
          require 'xcodeproj'
          project_path = Dir.glob("*.xcodeproj").first
          project = Xcodeproj::Project.open(project_path)
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
            end
          end
          project.save
          EOF
          ruby disable_signing.rb

      - name: Build App (Clean Command)
        run: |
          cd ios
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme $(ls -d *.xcodeproj | sed 's/\.xcodeproj//') \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath derivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package to IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r derivedData/Build/Products/Release-iphoneos/*.app Payload/
          zip -r RemotePlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemotePlayer-iOS
          path: ios/RemotePlayer.ipa
