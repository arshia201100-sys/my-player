name: Build Unsigned iOS IPA (Final Video Match)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
      
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native iOS Project
        run: npx expo prebuild --platform ios --no-install

      - name: Fix Expo Node Environment for Xcode
        run: |
          cd ios
          # تزریق کل مسیرهای نود و ان‌پی‌اکس به داخل مغز ایکس‌کد
          NODE_PATH=$(dirname $(which node))
          echo "export NODE_BINARY=$(which node)" > .xcode.env
          echo "export PATH=\"$NODE_PATH:\$PATH\"" >> .xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Nuke Apple Signing (Like Flutter Video)
        run: |
          cd ios
          cat << 'EOF' > nuke_signing.rb
          require 'xcodeproj'
          def disable_signing(project_path)
            return unless File.exist?(project_path)
            project = Xcodeproj::Project.open(project_path)
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
            project.save
          end
          disable_signing(Dir.glob("*.xcodeproj").first)
          disable_signing("Pods/Pods.xcodeproj")
          EOF
          ruby nuke_signing.rb

      - name: Build Unsigned App
        run: |
          cd ios
          export PATH="$(dirname $(which node)):$PATH"
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme $(ls -d *.xcodeproj | sed 's/\.xcodeproj//') \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA
        run: |
          cd ios/build
          mkdir -p Payload
          cp -r *.app Payload/
          zip -q -r my-player.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: ios/build/my-player.ipa
