name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:

env:
  CI: true
  EXPO_NO_TELEMETRY: 1

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native iOS Project (Clean)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Inject Node & NPX into Xcode (Brute Force Fix)
        run: |
          cd ios
          NODE_BIN=$(which node)
          NODE_DIR=$(dirname $NODE_BIN)
          
          # تزریق اجباری و عمیق مسیر Node به مغز Xcode
          echo "export PATH=\"$NODE_DIR:\$PATH\"" > .xcode.env
          echo "export NODE_BINARY=$NODE_BIN" >> .xcode.env
          cp .xcode.env .xcode.env.local
          
          # دور زدن محدودیت‌های امنیتی گیت‌هاب با لینک مستقیم
          sudo ln -sf $NODE_BIN /usr/local/bin/node
          sudo ln -sf $(which npx) /usr/local/bin/npx
          sudo ln -sf $(which npm) /usr/local/bin/npm

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned App
        run: |
          cd ios
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme $(ls -d *.xcodeproj | sed 's/\.xcodeproj//') \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CONFIGURATION_BUILD_DIR=build

      - name: Package to IPA
        run: |
          cd ios/build
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r RemotePlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemotePlayer-iOS
          path: ios/build/RemotePlayer.ipa
