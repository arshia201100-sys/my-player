name: Build Signed iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
      
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native iOS Project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Unzip and Install Apple Certificates
        env:
          KEYCHAIN_PASSWORD: "ci-password"
        run: |
          # خارج کردن فایل‌ها از زیپ (مصون از دستکاری گیت ویندوز)
          unzip certs.zip -d cert_files
          
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # ساخت کی‌چین موقت
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # پیدا کردن خودکار فایل‌ها با هر اسمی که داخل زیپ دارن
          CERT_FILE=$(find cert_files -name "*.p12" | head -n 1)
          PROV_FILE=$(find cert_files -name "*.mobileprovision" | head -n 1)

          # ایمپورت سرتیفیکیت سالم با پسورد 1
          security import "$CERT_FILE" -P "1" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # نصب پرویژن پروفایل
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROV_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build Signed App
        run: |
          cd ios
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme $(ls -d *.xcodeproj | sed 's/\.xcodeproj//') \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build"

      - name: Package to IPA
        run: |
          cd ios/build
          mkdir -p Payload
          cp -r *.app Payload/
          zip -q -r my-player.ipa Payload

      - name: Upload Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-IPA
          path: ios/build/my-player.ipa
