name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
      
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'
          
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install NPM
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Fix Node for Expo Scripts
        run: |
          cd ios
          echo "export NODE_BINARY=$(which node)" > .xcode.env
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local
          sudo ln -sf $(which node) /usr/local/bin/node

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Nuke Code Signing via Ruby
        run: |
          cd ios
          cat << 'EOF' > nuke_signing.rb
          require 'xcodeproj'
          def disable_signing(project_path)
            return unless File.exist?(project_path)
            project = Xcodeproj::Project.open(project_path)
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
            project.save
          end
          disable_signing(Dir.glob("*.xcodeproj").first)
          disable_signing("Pods/Pods.xcodeproj")
          EOF
          ruby nuke_signing.rb

      - name: Build Unsigned App
        run: |
          cd ios
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme $(ls -d *.xcodeproj | sed 's/\.xcodeproj//') \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath derivedData \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r derivedData/Build/Products/Release-iphoneos/*.app Payload/
          zip -q -r my-player.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: ios/my-player.ipa
