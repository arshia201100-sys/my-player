name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Global Node Paths
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node
          sudo ln -sf $(which npm) /usr/local/bin/npm
          sudo ln -sf $(which npx) /usr/local/bin/npx

      - name: Generate Native iOS Project (Clean)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Configure Xcode Environment
        run: |
          cd ios
          # تزریق آدرس مطلق نود برای اسکریپت‌های داخلی
          echo "export NODE_BINARY=/usr/local/bin/node" > .xcode.env.local
          # خاموش کردن سندباکس در هسته مک
          defaults write com.apple.dt.Xcode IDEEnableUserScriptSandboxing -bool NO

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned App
        run: |
          cd ios
          
          # ایجاد فایل کانفیگ برای اعمال بدون خطرِ تنظیمات ساین
          cat << 'EOF' > unsigned.xcconfig
          CODE_SIGN_IDENTITY =
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          EOF
          
          xcodebuild build \
            -workspace *.xcworkspace \
            -scheme $(ls -d *.xcodeproj | sed 's/\.xcodeproj//') \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -xcconfig unsigned.xcconfig \
            -derivedDataPath derivedData \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r derivedData/Build/Products/Release-iphoneos/*.app Payload/
          zip -r RemotePlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemotePlayer-iOS
          path: ios/RemotePlayer.ipa
